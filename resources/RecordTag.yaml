resource:
  name: RecordTag
  table: record_tags
  timestamps: true
  soft_delete: false

fields:
  - name: owner_id
    type: int
    nullable: false
  - name: sake_record_id
    type: int
    nullable: false
  - name: tag_id
    type: int
    nullable: false

relations:
  - name: owner
    kind: belongs_to
    target: User
    foreign_key: owner_id
  - name: sake_record
    kind: belongs_to
    target: SakeRecord
    foreign_key: sake_record_id
  - name: tag
    kind: belongs_to
    target: Tag
    foreign_key: tag_id

constraints:
  unique_together:
    - [sake_record_id, tag_id]

auth:
  ownership_field: owner_id
  permissions:
    create: authenticated
    read: owner
    update: owner
    delete: owner
