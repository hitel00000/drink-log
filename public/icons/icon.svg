<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3ECE0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8832D" />
      <stop offset="50%" stop-color="#967426" />
      <stop offset="100%" stop-color="#6E4F14" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2D2619" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Linen Card with Soft Rounded Corners -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="#967426" stroke-opacity="0.3" stroke-width="8" filter="url(#subtleShadow)" />
  
  <!-- Subtle Inner Border Accent -->
  <rect x="44" y="44" width="424" height="424" rx="100" fill="none" stroke="#967426" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Center Kanji: 酒 (Sake) with Serif Elegance -->
  <text 
    x="50%" 
    y="56%" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    fill="url(#goldGrad)" 
    font-family="'Noto Serif KR', 'Hiragino Mincho ProN', 'Yu Mincho', serif" 
    font-size="280" 
    font-weight="700"
    letter-spacing="-0.02em"
  >酒</text>
</svg>
