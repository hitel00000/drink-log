<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sake Log — 사케 테이스팅 저널</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #f8f5ee;
      --bg-surface: #ffffff;
      --bg-elevated: #f1ebd9;
      --bg-subtle: #f4eee2;
      
      --border-subtle: rgba(45, 38, 25, 0.08);
      --border-line: rgba(45, 38, 25, 0.14);
      --border-focus: #967426;
      
      --text-primary: #1c1812;
      --text-secondary: #635847;
      --text-tertiary: #998d78;
      
      --gold-primary: #967426;
      --gold-light: #7a5c18;
      --gold-soft-bg: rgba(150, 116, 38, 0.09);
      --gold-glow: rgba(150, 116, 38, 0.14);
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      --font-serif: 'Noto Serif KR', serif;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      
      --shadow-card: 0 10px 30px -8px rgba(45, 38, 25, 0.06);
      --transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 32px;
      line-height: 1.6;
    }

    .zen-container {
      width: 100%;
      max-width: 520px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Minimal Emblem */
    .emblem-wrap {
      margin-bottom: 28px;
      position: relative;
    }

    .emblem-box {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-line);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .emblem-kanji {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--gold-primary);
    }

    /* Typography */
    .brand-subtitle {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .hero-main-title {
      font-family: var(--font-serif);
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .hero-desc-text {
      font-size: 0.96rem;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 32px;
      max-width: 420px;
    }

    /* Minimal Keyword Pills */
    .keyword-pill-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .keyword-pill {
      font-size: 0.76rem;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 5px 12px;
      border-radius: var(--radius-full);
      box-shadow: 0 1px 4px rgba(45, 38, 25, 0.04);
    }

    /* Google Login CTA Card */
    .login-action-box {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-google-login {
      width: 100%;
      max-width: 360px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #ffffff;
      border: 1.5px solid var(--border-line);
      color: #1f1f1f;
      padding: 15px 24px;
      border-radius: var(--radius-full);
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(45, 38, 25, 0.05);
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-google-login:hover {
      border-color: var(--gold-primary);
      box-shadow: 0 6px 20px rgba(150, 116, 38, 0.16);
      transform: translateY(-2px);
    }

    .btn-google-login svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .login-helper-notice {
      font-size: 0.76rem;
      color: var(--text-tertiary);
    }

    .preview-jump-link {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--gold-primary);
      text-decoration: none;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--gold-soft-bg);
      border: 1px solid rgba(150, 116, 38, 0.2);
      transition: var(--transition);
    }

    .preview-jump-link:hover {
      background: var(--gold-glow);
    }

    /* Minimal Footer */
    .landing-footer {
      font-size: 0.76rem;
      color: var(--text-tertiary);
      text-align: center;
    }

    @media (max-width: 480px) {
      .hero-main-title {
        font-size: 1.8rem;
      }
      .emblem-box {
        width: 56px;
        height: 56px;
      }
      .emblem-kanji {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<!-- Main Zen Container (Zero-Scroll Pure View) -->
<div class="zen-container">
  <!-- Minimal Sake Emblem -->
  <div class="emblem-wrap">
    <div class="emblem-box">
      <span class="emblem-kanji">酒</span>
    </div>
  </div>

  <!-- Title & Description -->
  <div class="brand-subtitle">SAKE TASTING JOURNAL</div>
  <h1 class="hero-main-title">
    오늘 밤의 한 잔,<br>가장 정갈하게 기록하세요
  </h1>
  <p class="hero-desc-text">
    술 이름과 사진, 다시 마실 의향을 1분 만에 남기는<br>나만의 사케 시음 아카이브
  </p>

  <!-- Minimal Feature Pills -->
  <div class="keyword-pill-row">
    <span class="keyword-pill">✦ 1분 간편 기록</span>
    <span class="keyword-pill">✦ 라벨 갤러리</span>
    <span class="keyword-pill">✦ 클라우드 안전 보관</span>
  </div>

  <!-- Google Login Action Card -->
  <div class="login-action-box">
    <a href="/api/auth/google/login" class="btn-google-login" onclick="alert('Google OAuth 로그인 플로우가 시작됩니다.'); return false;">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Google 계정으로 시작하기
    </a>
    <span class="login-helper-notice">별도 가입 절차 없이 안전하게 동기화됩니다.</span>
  </div>

  <!-- Preview Link (For Demo) -->
  <a href="design-preview.html" class="preview-jump-link">
    로그인 후 메인 앱 화면 미리보기 →
  </a>
</div>

<!-- Footer -->
<footer class="landing-footer">
  © 2026 Sake Log · Cloud-First Tasting Journal
</footer>

</body>
</html>
